backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

site_url: "/"
display_url: "McGrath High School Portal"
logo_url: "/images/crest.png"

# All collections use single JSON files (not folders).
# This means each section is one file the site can fetch directly —
# no directory listing needed, works perfectly on Netlify.

collections:

  # ── SCHOOL SETTINGS ─────────────────────────────────
  - name: "settings"
    label: "⚙️ School Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "_data/settings.json"
        fields:
          - { label: "School Name", name: "school_name", widget: "string" }
          - { label: "School Motto", name: "motto", widget: "string" }
          - { label: "Current Term", name: "current_term", widget: "string", hint: "e.g. Term 1 · 2026" }
          - { label: "Newsletter Name", name: "newsletter_name", widget: "string", hint: "e.g. The McGrath Torch", required: false }
          - { label: "Newsletter Description", name: "newsletter_sub", widget: "text", required: false }
          - { label: "Student Count", name: "students", widget: "string", required: false }
          - { label: "Staff Count", name: "staff", widget: "string", required: false }
          - { label: "Co-curriculars Count", name: "cocurriculars", widget: "string", required: false }
          - { label: "Street Address", name: "address", widget: "string", required: false }
          - { label: "Phone Number", name: "phone", widget: "string", required: false }
          - { label: "Email Address", name: "email", widget: "string", required: false }
          - { label: "Office Hours", name: "office_hours", widget: "string", required: false }
          - { label: "Staff Portal Username", name: "staff_username", widget: "string" }
          - { label: "Staff Portal Password", name: "staff_password", widget: "string" }

  # ── LIVE TICKER ─────────────────────────────────────
  - name: "ticker"
    label: "📡 Live Ticker"
    files:
      - name: "items"
        label: "Ticker Announcements"
        file: "_data/ticker.json"
        fields:
          - label: "Announcements"
            name: "items"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { label: "Announcement Text", name: "text", widget: "string" }
              - { label: "Active", name: "active", widget: "boolean", default: true }

  # ── PUBLIC BULLETINS ─────────────────────────────────
  - name: "bulletins"
    label: "📋 Public Bulletins"
    files:
      - name: "list"
        label: "Bulletins List"
        file: "_data/bulletins.json"
        fields:
          - label: "Bulletins"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["General", "Academic", "Community", "Important", "Arts", "Achievement"]
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Achievement Card (dark blue style)", name: "achievement", widget: "boolean", default: false }

  # ── SPORTS & COMPETITION RESULTS ─────────────────────
  - name: "sports"
    label: "🏆 Sports & Competition Results"
    files:
      - name: "list"
        label: "Results List"
        file: "_data/sports.json"
        fields:
          - label: "Results"
            name: "items"
            widget: "list"
            summary: "{{fields.sport}} — {{fields.score}}"
            fields:
              - { label: "Sport / Competition Name", name: "sport", widget: "string" }
              - { label: "Sport Emoji", name: "emoji", widget: "string", hint: "e.g. 🏊 or 🏀" }
              - { label: "Event Name & Date", name: "event", widget: "string" }
              - { label: "Our Team / Student", name: "our_team", widget: "string" }
              - { label: "Opponent / Category", name: "opponent", widget: "string" }
              - { label: "Score / Result", name: "score", widget: "string", hint: "e.g. 1st 🥇 or 3-1 or WIN" }
              - label: "Outcome"
                name: "outcome"
                widget: "select"
                options: ["win", "loss", "draw", "placed"]
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Date", name: "date", widget: "datetime" }

  # ── UPCOMING EVENTS ──────────────────────────────────
  - name: "events"
    label: "📅 Events & Gallery"
    files:
      - name: "list"
        label: "Events List"
        file: "_data/events.json"
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Event Name", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime" }
              - { label: "Time & Location", name: "meta", widget: "string", required: false, hint: "e.g. 6:30pm · School Hall" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["academic", "sports", "cultural", "pageant", "patriotic", "community"]
              - { label: "Year", name: "year", widget: "number", default: 2026 }
              - { label: "Emoji Icon", name: "icon", widget: "string", default: "📅", hint: "Emoji shown on the card" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Published (show on site)", name: "published", widget: "boolean", default: true }
              - { label: "Highlight (gold date box)", name: "highlight", widget: "boolean", default: false }
              - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Main photo shown on the event card" }
              - label: "Photo Gallery"
                name: "gallery"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Photo", name: "url", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }

  # ── IMPORTANT NOTICES ────────────────────────────────
  - name: "notices"
    label: "⚠️ Important Notices"
    files:
      - name: "list"
        label: "Notices List"
        file: "_data/notices.json"
        fields:
          - label: "Notices"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Urgent (red highlight)", name: "urgent", widget: "boolean", default: false }
              - { label: "Active (show on site)", name: "active", widget: "boolean", default: true }

  # ── NEWSLETTER ISSUES ────────────────────────────────
  - name: "newsletter"
    label: "📰 Newsletter Issues"
    files:
      - name: "list"
        label: "Newsletter Issues"
        file: "_data/newsletter.json"
        fields:
          - label: "Issues"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Issue Title", name: "title", widget: "string", hint: "e.g. The McGrath Torch — Term 1 2026" }
              - { label: "Publication Date", name: "date", widget: "datetime" }
              - { label: "PDF File", name: "pdf", widget: "file", hint: "Upload the newsletter PDF", required: false }

  # ── PHOTO GALLERY ────────────────────────────────────
  - name: "gallery"
    label: "🖼️ Photo Gallery"
    files:
      - name: "list"
        label: "Gallery Photos"
        file: "_data/gallery.json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Caption", name: "caption", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Emoji (shown if no photo uploaded)", name: "emoji", widget: "string", default: "📷" }
              - label: "Background Colour (used if no photo)"
                name: "bg"
                widget: "select"
                default: "blue"
                options: ["blue", "gold", "green", "purple", "red", "navy"]

  # ── STAFF PORTAL SETTINGS ────────────────────────────
  - name: "staff_settings"
    label: "🔒 Staff Portal Settings"
    files:
      - name: "contacts"
        label: "Staff Contacts Directory"
        file: "_data/staff_contacts.json"
        fields:
          - label: "Contacts"
            name: "contacts"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Extension", name: "ext", widget: "string" }
              - { label: "Emoji Icon", name: "emoji", widget: "string", default: "👤" }
              - { label: "Avatar Background Colour", name: "bg", widget: "string", default: "#e8f7fd" }
              - { label: "Avatar Text Colour", name: "color", widget: "string", default: "#0e6fa0" }

  # ── STAFF BULLETINS (INTERNAL) ───────────────────────
  - name: "staff_bulletins"
    label: "🔒 Staff Bulletins (Internal)"
    files:
      - name: "list"
        label: "Staff Bulletins"
        file: "_data/staff_bulletins.json"
        fields:
          - label: "Bulletins"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime" }
              - { label: "Category", name: "category", widget: "string", hint: "e.g. Admin, ICT Department, Executive" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Urgent", name: "urgent", widget: "boolean", default: false }

  # ── STAFF RESOURCE LIBRARY ───────────────────────────
  - name: "resources"
    label: "📁 Staff Resource Library"
    files:
      - name: "list"
        label: "Resources"
        file: "_data/resources.json"
        fields:
          - label: "Resources"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Document Name", name: "name", widget: "string" }
              - { label: "File Details", name: "meta", widget: "string", hint: "e.g. PDF · 2.4 MB · Updated Feb 2026" }
              - { label: "Emoji Icon", name: "emoji", widget: "string", default: "📄" }
              - { label: "File Upload or URL", name: "url", widget: "file", required: false }
